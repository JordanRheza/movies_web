<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="filmoWeb - Busca películas, series y más con toda la info y trailers.">
  <meta name="keywords" content="películas, series, trailers, cine, filmoWeb">
  <meta name="author" content="Jordan Rheza">
  <link rel="icon" href="img/favicon.webp" type="image/webp">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">

  <title>filmoWeb</title>
</head>

<body>
  <!-- Fondo -->
  <div class="custom-bg"></div>

  <nav class="navbar sticky-top glass container rounded">
    <div class="container-fluid">
      <div class="d-flex justify-content-between w-100 flex-wrap">
        <!-- Botón del offcanvas -->
        <button class="navbar-toggler mb-1" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
  
        <!-- Título -->
        <a class="navbar-brand margin-title fs-3" href="/">filmo<span class="text-info">Web</span></a>
  
        <!-- Input + botón responsive -->
        <div class="d-flex my-auto" >
          <input class="form-control me-2" type="search" placeholder="Buscar Pelicula:" id="searchTxt" aria-label="Search">
          <button class="btn btn-outline-info" type="submit" id="searchBtn">Buscar</button>
        </div>
      </div>
  
      
  </nav>
  
  <!-- Offcanvas -->
  <div class="offcanvas offcanvas-start glass rounded" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
    <div class="offcanvas-header border-bottom border-info ">
      <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Menú</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <!-- Uso Futuro -->
      <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
        <li class="nav-item">
          <a class="nav-link" aria-current="page" href="#">Serie</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Pelicula</a>
        </li>
      </ul>
    </div>
  </div>
</div>
  <main class="container">
    <div class="row" id="results">
      <!-- Se muestra las peliculas recientemente estrenadas al carga la pagina -->
    </div>

    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title" id="modalLabel">Trailer</h4>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body" id="modal-body">
            <!-- Se muestra el trailer y su contenido -->
          </div>
        </div>
      </div>
    </div>
   
  </main>

  <script src="js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
    crossorigin="anonymous"></script>
</body>

</html>
